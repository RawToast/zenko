openapi: 3.0.0
info:
  version: 1.0.0
  title: Enum Demo API
  description: Demonstrates open and closed enums
servers:
  - url: http://api.example.com/v1
paths:
  /products:
    get:
      summary: List products
      operationId: listProducts
      parameters:
        - name: status
          in: query
          description: Filter by product status (open enum - accepts unknown values)
          required: false
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: category
          in: query
          description: Filter by category (closed enum - only accepts known values)
          required: false
          schema:
            $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    ProductStatus:
      type: string
      enum:
        - available
        - discontinued
        - coming_soon
      description: Product availability status (open enum)
    Category:
      type: string
      enum:
        - electronics
        - clothing
        - books
      description: Product category (closed enum)
    Product:
      type: object
      required:
        - id
        - name
        - status
        - category
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        category:
          $ref: "#/components/schemas/Category"
        price:
          type: number
    CreateProductRequest:
      type: object
      required:
        - name
        - status
        - category
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        category:
          $ref: "#/components/schemas/Category"
        price:
          type: number
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
